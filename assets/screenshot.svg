    <text x="14" y="18.5" text-anchor="middle" fill="#fff" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.5" font-weight="700">81</text>
  </g>
  <text x="880" y="29" fill="#94A3B8" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="15">🔊  🔋  ⏻</text>

