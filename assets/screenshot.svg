    <text x="476" y="88" fill="#9CA3AF" font-weight="700">CLI Usage  ·  updated 14:05</text>
    <line x1="466" y1="104" x2="868" y2="104" stroke="#2E3346"/>
    <rect x="462" y="114" width="410" height="38" rx="8" fill="#2A2F45"/>
    <text x="476" y="139" fill="#22C55E">●</text>
    <text x="500" y="139" fill="#F8FAFC" font-weight="700">Claude Code</text>
    <text x="602" y="139" fill="#94A3B8">—  81% left</text>
    <text x="852" y="139" fill="#94A3B8">›</text>
    <text x="476" y="180" fill="#22C55E">●</text>
