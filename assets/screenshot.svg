    <g transform="translate(420 470)">
      <circle cx="22" cy="22" r="21" fill="#181820"/>
      <circle cx="22" cy="22" r="16" stroke="#fff" stroke-opacity="0.28" stroke-width="5"/>
      <path d="M22 6 A16 16 0 0 1 37.2 17" stroke="#F59E0B" stroke-width="5"/>
      <text x="22" y="28" text-anchor="middle" fill="#fff" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="700">22</text>
