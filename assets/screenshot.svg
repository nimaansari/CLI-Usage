  <text x="520" y="29" text-anchor="middle" fill="#E2E8F0" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="600">Mon 14:05</text>
  <!-- ring icon in tray -->
